name: PixVerse Daily Streak Automated

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  execute-streak-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Provision Dependencies & Playwright Binaries
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Execute Automated Login Sequence
        env:
          USER_ID: ${{ secrets.USER_ID }}
          USER_PASS: ${{ secrets.USER_PASS }}
          USER_ID2: ${{ secrets.USER_ID2 }}
          USER_PASS2: ${{ secrets.USER_PASS2 }}
          USER_ID3: ${{ secrets.USER_ID3 }}
          USER_PASS3: ${{ secrets.USER_PASS3 }}
        run: python pixverse_bot.py

      - name: Capture Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headless-failure-screenshots
          path: error_*.png
          retention-days: 5