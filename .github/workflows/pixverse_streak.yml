name: PixVerse Daily Streak Automated

on:
  schedule:
    # Executes at 04:30 UTC daily
    - cron: '30 4 * * *'
  workflow_dispatch: # Permits manual execution for testing

jobs:
  execute-streak-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Provision Dependencies & Playwright Binaries
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Execute Automated Login Sequence
        env:
          USER_ID: ${{ secrets.USER_ID }}
          USER_PASS: ${{ secrets.USER_PASS }}
        run: python pixverse_bot.py

      - name: Capture Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headless-failure-screenshot
          path: error_screenshot.png
          retention-days: 5